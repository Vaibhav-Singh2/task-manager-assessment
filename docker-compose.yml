services:
  mongo:
    image: mongo:latest
    container_name: task-manager-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: task-manager
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: task-manager-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/task-manager
    depends_on:
      - mongo

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=
    container_name: task-manager-web
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - frontend/.env
    depends_on:
      - api

volumes:
  mongo_data:
