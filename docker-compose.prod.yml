services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: task-manager-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - apps/api/.env

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: task-manager-web
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - apps/web/.env
    depends_on:
      - api
