name: CI / CD → Deploy to EC2

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:

# Prevent concurrent deployments on the same branch.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Quality Gate (Lint, Type-check, Test)
  # ─────────────────────────────────────────────
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    outputs:
      install_dependencies: ${{ steps.install_dependencies.outcome }}
      lint: ${{ steps.lint.outcome }}
      type_check: ${{ steps.type_check.outcome }}
      tests: ${{ steps.run_tests.outcome }}
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - id: install_dependencies
        name: Install dependencies
        run: yarn install --frozen-lockfile

      - id: lint
        name: Lint
        run: yarn lint

      - id: type_check
        name: Type-check
        run: yarn check-types

      - id: run_tests
        name: Run Tests
        run: yarn test
        env:
          MONGO_URI: mongodb://localhost:27017/test_db
          JWT_SECRET: test_secret_key_for_ci_cd_pipeline

  # ─────────────────────────────────────────────
  # Job 2: Build & Push Images to GHCR
  # ─────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - name: backend
            image: api
          - name: frontend
            image: web
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate lowercase repository owner name
        id: prep
        run: |
          echo "owner_lc=${OWNER,,}" >> ${GITHUB_OUTPUT}
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Parallel Build using Matrix
      - name: Build & Push ${{ matrix.image }} Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.name }}/Dockerfile
          push: true
          build-args: |
            ${{ matrix.name == 'frontend' && 'VITE_API_URL=' || '' }}
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner_lc }}/task-manager-${{ matrix.image }}:latest
            ghcr.io/${{ steps.prep.outputs.owner_lc }}/task-manager-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Job 3: Deploy to EC2 (via Docker Compose)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    outputs:
      deploy_via_ssh: ${{ steps.deploy_via_ssh.outcome }}
      verify_health: ${{ steps.verify_health.outcome }}

    steps:
      - id: deploy_via_ssh
        name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Inject secrets into the EC2 environment securely
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: MONGO_URI,JWT_SECRET,VITE_API_URL,GITHUB_TOKEN,GITHUB_ACTOR,REPO_OWNER
          script: |
            set -euo pipefail

            # 1. Ensure project directory exists
            PROJECT_DIR="~/task-manager-assessment"
            mkdir -p $PROJECT_DIR
            cd $PROJECT_DIR

            # 2. Pull latest code from GitHub
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch origin
              git reset --hard origin/main
            fi

            # 3. Securely generate .env files from GitHub Secrets
            echo "Creating environment files..."
            mkdir -p backend frontend

            # API .env
            cat <<EOF > backend/.env
            MONGO_URI=${MONGO_URI}
            JWT_SECRET=${JWT_SECRET}
            PORT=4000
            EOF

            # Web .env
            cat <<EOF > frontend/.env
            VITE_API_URL=${VITE_API_URL:-}
            EOF

            # 4. Log in to GHCR on the EC2 machine
            echo "Logging into GHCR..."
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            # 5. Set image variables in lower case
            OWNER_LOWER=$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')
            export API_IMAGE="ghcr.io/${OWNER_LOWER}/task-manager-api:latest"
            export WEB_IMAGE="ghcr.io/${OWNER_LOWER}/task-manager-web:latest"

            # 6. Pull latest images and restart stack
            echo "Pulling production images..."
            docker compose -f docker-compose.prod.yml pull

            echo "Starting containers..."
            docker compose -f docker-compose.prod.yml up -d

            # 7. Clean up dangling images to save space
            docker image prune -f

      - id: verify_health
        name: Verify API Health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            # Poll health endpoint to ensure the API container is running
            echo "Waiting for API to initialize..."

            for i in $(seq 1 12); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/health || echo "000")
              if [ "${STATUS}" = "200" ]; then
                echo "✅ Backend API is reachable and healthy (attempt ${i})"
                exit 0
              fi
              echo "⏳ Attempt ${i}/12 — API status ${STATUS}, retrying in 5s..."
              sleep 5
            done

            echo "❌ Backend API is unreachable or returned unhealthy status"
            exit 1

  # ─────────────────────────────────────────────
  # Job 3: Final Summary (Always runs)
  # ─────────────────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [quality, build, deploy]
    if: always()

    steps:
      - name: Publish summary
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result || 'skipped' }}
          DEPLOY_RESULT: ${{ needs.deploy.result || 'skipped' }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_ACTOR: ${{ github.actor }}
          REPO_NAME: ${{ github.repository }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          OVERALL_RESULT="Success"
          OVERALL_EMOJI="🚀"
          if [ "$QUALITY_RESULT" != "success" ] || [ "$BUILD_RESULT" != "success" ] || [ "$DEPLOY_RESULT" != "success" ]; then
            OVERALL_RESULT="Failed"
            OVERALL_EMOJI="❌"
          fi

          format_emoji() {
            if [ "$1" = "success" ]; then
              echo "🟢 Success"
            elif [ "$1" = "failure" ]; then
              echo "🔴 Failed"
            elif [ "$1" = "cancelled" ]; then
              echo "⚪ Cancelled"
            else
              echo "🟡 Skipped"
            fi
          }

          QUALITY_EMOJI=$(format_emoji "$QUALITY_RESULT")
          BUILD_EMOJI=$(format_emoji "$BUILD_RESULT")
          DEPLOY_EMOJI=$(format_emoji "$DEPLOY_RESULT")

          OWNER_LOWER=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')

          {
            echo "# $OVERALL_EMOJI Stitch Deployment Summary"
            echo ""
            echo "A production deployment was triggered by **$COMMIT_ACTOR** on repository **$REPO_NAME**."
            echo ""
            echo "### ℹ️ Trigger Information"
            echo "* **Commit SHA:** \`$COMMIT_SHA\`"
            echo "* **Trigger Actor:** @$COMMIT_ACTOR"
            echo "* **Target Branch:** \`main\`"
            echo ""
            echo "### 📋 Pipeline Job Matrix"
            echo "| Job Stage | Status | Notes |"
            echo "| :--- | :--- | :--- |"
            echo "| **Quality Gate** | $QUALITY_EMOJI | Yarn workspace linting, typing, & integration testing |"
            echo "| **Build & Push** | $BUILD_EMOJI | Pre-compiling API & Web images on runner, storing in GHCR |"
            echo "| **Deploy to EC2** | $DEPLOY_EMOJI | Pulling images and executing zero-downtime stack reload |"
            echo ""
            echo "### 🌐 Production Artifacts"
            echo "* **Docker API Package:** [\`ghcr.io/${OWNER_LOWER}/task-manager-api:latest\`](https://github.com/${OWNER_LOWER}/pkgs/container/task-manager-api)"
            echo "* **Docker Web Package:** [\`ghcr.io/${OWNER_LOWER}/task-manager-web:latest\`](https://github.com/${OWNER_LOWER}/pkgs/container/task-manager-web)"
            echo ""
            echo "---"
            echo "*Overall Pipeline execution status: **$OVERALL_RESULT**.*"
          } >> "$GITHUB_STEP_SUMMARY"
