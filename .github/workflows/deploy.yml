name: CI / CD → Deploy to EC2

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:

# Prevent concurrent deployments on the same branch.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Quality Gate (Lint, Type-check, Test)
  # ─────────────────────────────────────────────
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    outputs:
      install_dependencies: ${{ steps.install_dependencies.outcome }}
      lint: ${{ steps.lint.outcome }}
      type_check: ${{ steps.type_check.outcome }}
      tests: ${{ steps.run_tests.outcome }}
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "yarn"

      - id: install_dependencies
        name: Install dependencies
        run: yarn install --frozen-lockfile

      - id: lint
        name: Lint
        run: yarn lint

      - id: type_check
        name: Type-check
        run: yarn check-types

      - id: run_tests
        name: Run Tests
        run: yarn test
        env:
          MONGO_URI: mongodb://localhost:27017/test_db
          JWT_SECRET: test_secret_key_for_ci_cd_pipeline

  # ─────────────────────────────────────────────
  # Job 2: Deploy to EC2 (via Docker Compose)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'
    environment: production
    outputs:
      deploy_via_ssh: ${{ steps.deploy_via_ssh.outcome }}
      verify_health: ${{ steps.verify_health.outcome }}

    steps:
      - id: deploy_via_ssh
        name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Inject secrets into the EC2 environment securely
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: MONGO_URI,JWT_SECRET,VITE_API_URL
          script: |
            set -euo pipefail

            # 1. Ensure project directory exists
            PROJECT_DIR="~/task-manager-assessment"
            mkdir -p $PROJECT_DIR
            cd $PROJECT_DIR

            # 2. Pull latest code from GitHub
            # If directory is empty, clone it. Otherwise, pull.
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch origin
              git reset --hard origin/main
            fi

            # 3. Securely generate .env files from GitHub Secrets
            echo "Creating environment files..."

            mkdir -p apps/api apps/web

            # API .env
            cat <<EOF > apps/api/.env
            MONGO_URI=${MONGO_URI}
            JWT_SECRET=${JWT_SECRET}
            PORT=4000
            EOF

            # Web .env
            cat <<EOF > apps/web/.env
            VITE_API_URL=${VITE_API_URL:-}
            EOF

            # 4. Build and deploy using Docker Compose
            echo "Deploying via Docker Compose..."
            docker compose -f docker-compose.prod.yml up -d --build

            # 5. Prune dangling images to save disk space
            docker image prune -f

      - id: verify_health
        name: Verify API Health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            # Poll health endpoint to ensure the API container is running
            echo "Waiting for API to initialize..."

            for i in $(seq 1 12); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/health || echo "000")
              if [ "${STATUS}" = "200" ]; then
                echo "✅ Backend API is reachable and healthy (attempt ${i})"
                exit 0
              fi
              echo "⏳ Attempt ${i}/12 — API status ${STATUS}, retrying in 5s..."
              sleep 5
            done

            echo "❌ Backend API is unreachable or returned unhealthy status"
            exit 1

  # ─────────────────────────────────────────────
  # Job 3: Final Summary (Always runs)
  # ─────────────────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [quality, deploy]
    if: always()

    steps:
      - name: Publish summary
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          INSTALL_RESULT: ${{ needs.quality.outputs.install_dependencies || 'skipped' }}
          LINT_RESULT: ${{ needs.quality.outputs.lint || 'skipped' }}
          TYPE_CHECK_RESULT: ${{ needs.quality.outputs.type_check || 'skipped' }}
          TESTS_RESULT: ${{ needs.quality.outputs.tests || 'skipped' }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DOCKER_DEPLOY_RESULT: ${{ needs.deploy.outputs.deploy_via_ssh || 'skipped' }}
          HEALTH_RESULT: ${{ needs.deploy.outputs.verify_health || 'skipped' }}
        run: |
          OVERALL_RESULT="success"
          if [ "$QUALITY_RESULT" != "success" ]; then
            OVERALL_RESULT="failure"
          fi

          if [ "$DEPLOY_RESULT" = "failure" ] || [ "$DEPLOY_RESULT" = "cancelled" ]; then
            OVERALL_RESULT="failure"
          fi

          {
            echo "# Pipeline Summary"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Quality Gate | $QUALITY_RESULT |"
            echo "| Install dependencies | $INSTALL_RESULT |"
            echo "| Lint | $LINT_RESULT |"
            echo "| Type-check | $TYPE_CHECK_RESULT |"
            echo "| Tests | $TESTS_RESULT |"
            echo "| Deploy job | $DEPLOY_RESULT |"
            echo "| Docker Compose deploy | $DOCKER_DEPLOY_RESULT |"
            echo "| API health check | $HEALTH_RESULT |"
            echo ""
            echo "Overall workflow result: $OVERALL_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
